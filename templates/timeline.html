<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediBridge | Patient Timeline</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { display: block; height: auto; overflow: auto; padding: 2rem; }
        .wrap { max-width: 860px; margin: 0 auto; }
        .row { display: flex; gap: .75rem; align-items: center; flex-wrap: wrap; }
        .muted { color: var(--text-muted); font-size: .85rem; }
        .card + .card { margin-top: 1.25rem; }
        .notice { background: #fef9c3; padding: .6rem 1rem; border-radius: 8px; font-size: .85rem; margin-bottom: 1rem; }
        .report { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: 1rem; border: 1px solid var(--border-color); border-radius: 10px; margin-bottom: .6rem; background: #fff; }
        .report.locked { opacity: .55; }
        .pill { font-size: .72rem; font-weight: 700; padding: .3rem .6rem; border-radius: 50px; background: #e2e8f0; color: #334155; white-space: nowrap; }
        .pill.available { background: #dcfce7; color: #166534; }
        .pill.locked { background: #fee2e2; color: #991b1b; }
        #viewer { width: auto; }
        #pendingBox { display: none; border-left: 4px solid var(--transfer-color); }
        #pendingBox h3, .card h3 { font-size: 1.05rem; margin-bottom: .75rem; }
        .btn-small { padding: .45rem .9rem; font-size: .8rem; }
    </style>
</head>
<body data-patient-id="{{ patient_id }}">
<div class="wrap">
    <div class="row" style="justify-content: space-between; margin-bottom: 1rem;">
        <a href="/" style="color: var(--brand-color); font-weight: 600; text-decoration: none;" data-i18n="back">← Dashboard</a>
        <button class="btn btn-secondary" id="langBtn" onclick="toggleLang()">తెలుగు</button>
    </div>

    <div class="notice" data-i18n="demo">Demo data – fictional. Not connected to real hospitals.</div>

    <div class="card">
        <h2 id="patientName">…</h2>
        <p class="muted" id="patientMeta"></p>
        <div class="row" style="margin-top: 1rem;">
            <label for="viewer" data-i18n="viewAs" style="margin: 0;">View as</label>
            <select id="viewer" onchange="loadAll()">
                <option value="" data-i18n="patientView">Patient (own record)</option>
                {% for h in hospitals %}
                <option value="{{ h }}">{{ h }}</option>
                {% endfor %}
            </select>
            <button class="btn btn-primary btn-small" id="requestBtn" onclick="requestAccess()" style="display: none;" data-i18n="requestAccess">Request access</button>
        </div>
    </div>

    <div class="card" id="pendingBox"></div>

    <div class="card">
        <h3 data-i18n="reportsTitle">Medical reports</h3>
        <div id="reportList"></div>
    </div>

    <div class="card">
        <h3 data-i18n="history">Consent history</h3>
        <div id="historyList"></div>
    </div>
</div>

<script>
const PATIENT_ID = document.body.dataset.patientId;
let lang = 'en';
let patient = null;

const i18n = {
    en: {
        back: '← Dashboard',
        demo: 'Demo data – fictional. Not connected to real hospitals.',
        viewAs: 'View as',
        patientView: 'Patient (own record)',
        reportsTitle: 'Medical reports',
        noReports: 'No reports yet.',
        requestAccess: 'Request access',
        pending: 'Pending requests',
        wantsAccess: 'requests access to this patient’s records',
        approve: 'Approve',
        deny: 'Deny',
        history: 'Consent history',
        noHistory: 'No consent activity yet.',
        available: 'Available',
        linkRequired: 'Link required',
        locked: 'Locked',
        hidden: 'Hidden until patient approves',
        PENDING: 'Pending',
        APPROVED: 'Approved',
        DENIED: 'Denied',
        accessApproved: 'Access approved',
        notFound: 'Patient not found'
    },
    te: {
        back: '← డాష్‌బోర్డ్',
        demo: 'డెమో డేటా – కల్పితం. నిజమైన ఆసుపత్రులతో అనుసంధానించబడలేదు.',
        viewAs: 'ఇలా చూడండి',
        patientView: 'రోగి (స్వంత రికార్డు)',
        reportsTitle: 'వైద్య నివేదికలు',
        noReports: 'ఇంకా నివేదికలు లేవు.',
        requestAccess: 'యాక్సెస్ అభ్యర్థించండి',
        pending: 'పెండింగ్ అభ్యర్థనలు',
        wantsAccess: 'ఈ రోగి రికార్డులకు యాక్సెస్ కోరుతోంది',
        approve: 'ఆమోదించండి',
        deny: 'తిరస్కరించండి',
        history: 'సమ్మతి చరిత్ర',
        noHistory: 'ఇంకా సమ్మతి కార్యకలాపం లేదు.',
        available: 'అందుబాటులో ఉంది',
        linkRequired: 'లింక్ అవసరం',
        locked: 'లాక్ చేయబడింది',
        hidden: 'రోగి ఆమోదించే వరకు దాచబడింది',
        PENDING: 'పెండింగ్',
        APPROVED: 'ఆమోదించబడింది',
        DENIED: 'తిరస్కరించబడింది',
        accessApproved: 'యాక్సెస్ ఆమోదించబడింది',
        notFound: 'రోగి కనుగొనబడలేదు'
    }
};

function t(key) {
    return i18n[lang][key] || i18n.en[key] || key;
}

function escapeHtml(value) {
    if (value === null || value === undefined) return '';
    return String(value)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
}

function applyStaticText() {
    document.querySelectorAll('[data-i18n]').forEach(el => {
        el.textContent = t(el.dataset.i18n);
    });
    document.getElementById('langBtn').textContent = lang === 'en' ? 'తెలుగు' : 'English';
}

function toggleLang() {
    lang = lang === 'en' ? 'te' : 'en';
    applyStaticText();
    loadAll();
}

async function loadAll() {
    applyStaticText();
    const viewer = document.getElementById('viewer').value;
    try {
        const [pRes, rRes, cRes] = await Promise.all([
            fetch(`/api/patients/${PATIENT_ID}`),
            fetch(`/api/patients/${PATIENT_ID}/reports?viewer=${encodeURIComponent(viewer)}`),
            fetch(`/api/patients/${PATIENT_ID}/consents`)
        ]);
        if (!pRes.ok) {
            document.getElementById('patientName').textContent = t('notFound');
            return;
        }
        patient = await pRes.json();
        const reports = await rRes.json();
        const consents = await cRes.json();
        renderHeader(viewer, consents);
        renderReports(reports);
        renderPending(consents, viewer);
        renderHistory(consents);
    } catch (err) {
        console.error(err);
        alert('Could not load the record. Is the server running?');
    }
}

function renderHeader(viewer, consents) {
    document.getElementById('patientName').textContent = patient.full_name;
    document.getElementById('patientMeta').textContent =
        `${patient.patient_id} · ${patient.hospital_name} · ${patient.hospital_department}`;

    const canRequest = viewer && viewer !== patient.hospital_name;
    const alreadyApproved = consents.some(c => c.requesting_hospital === viewer && c.status === 'APPROVED');
    const btn = document.getElementById('requestBtn');
    btn.style.display = canRequest && !alreadyApproved ? 'inline-block' : 'none';
    if (canRequest && alreadyApproved) {
        document.getElementById('patientMeta').textContent += ` · ✓ ${t('accessApproved')}`;
    }
}

function renderReports(reports) {
    const list = document.getElementById('reportList');
    if (!reports.length) {
        list.innerHTML = `<p class="muted">${t('noReports')}</p>`;
        return;
    }
    list.innerHTML = reports.map(r => {
        const locked = r.status === 'LOCKED';
        const label = locked ? t('hidden') : r.report_type;
        let pillClass = '';
        let pillText = t('linkRequired');
        if (locked) { pillClass = 'locked'; pillText = t('locked'); }
        else if (r.status === 'AVAILABLE') { pillClass = 'available'; pillText = t('available'); }
        return `
            <div class="report ${locked ? 'locked' : ''}">
                <div>
                    <strong>${escapeHtml(label)}</strong>
                    <div class="muted">${escapeHtml(r.hospital_name)} · ${escapeHtml(r.report_date)}</div>
                </div>
                <span class="pill ${pillClass}">${escapeHtml(pillText)}</span>
            </div>`;
    }).join('');
}

function renderPending(consents, viewer) {
    const box = document.getElementById('pendingBox');
    const pending = consents.filter(c => c.status === 'PENDING');
    // Only the patient's own view can approve or deny requests
    if (viewer !== '' || pending.length === 0) {
        box.style.display = 'none';
        box.innerHTML = '';
        return;
    }
    box.style.display = 'block';
    box.innerHTML = `<h3>${t('pending')}</h3>` + pending.map(c => `
        <div class="report">
            <div><strong>${escapeHtml(c.requesting_hospital)}</strong>
                <div class="muted">${t('wantsAccess')}</div></div>
            <div class="row">
                <button class="btn btn-primary btn-small" onclick="respond(${c.consent_id}, 'APPROVED')">${t('approve')}</button>
                <button class="btn btn-secondary btn-small" onclick="respond(${c.consent_id}, 'DENIED')">${t('deny')}</button>
            </div>
        </div>`).join('');
}

function renderHistory(consents) {
    const list = document.getElementById('historyList');
    if (!consents.length) {
        list.innerHTML = `<p class="muted">${t('noHistory')}</p>`;
        return;
    }
    list.innerHTML = consents.map(c => `
        <div class="report">
            <div><strong>${escapeHtml(c.requesting_hospital)}</strong>
                <div class="muted">${escapeHtml(c.created_at)}</div></div>
            <span class="pill ${c.status === 'APPROVED' ? 'available' : (c.status === 'DENIED' ? 'locked' : '')}">${escapeHtml(t(c.status))}</span>
        </div>`).join('');
}

async function requestAccess() {
    const viewer = document.getElementById('viewer').value;
    const res = await fetch('/api/consents', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ patient_id: PATIENT_ID, requesting_hospital: viewer })
    });
    const data = await res.json();
    if (!res.ok) alert(data.error || 'Request failed.');
    loadAll();
}

async function respond(consentId, decision) {
    await fetch(`/api/consents/${consentId}/respond`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ decision })
    });
    loadAll();
}

document.addEventListener('DOMContentLoaded', () => {
    applyStaticText();
    loadAll();
});
</script>
</body>
</html>
